
name: Secure CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate HTML file
        run: |
          python -c "from html.parser import HTMLParser; from pathlib import Path; p = HTMLParser(); p.feed(Path('index.html').read_text(encoding='utf-8')); p.close(); print('HTML parsing completed successfully')"

      - name: Check CSS file
        run: |
          python -c "from pathlib import Path; p = Path('style.css'); assert p.exists() and p.stat().st_size > 0, 'CSS file missing or empty'; print('CSS file validation passed')"

      - name: Check README
        run: |
          python -c "from pathlib import Path; p = Path('README.md'); assert p.exists() and p.stat().st_size > 0, 'README missing or empty'; print('README validation passed')"
      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Scan Terraform with Checkov
        run: |
          checkov -d infra --framework terraform

  aws-authentication:
    name: Authenticate with AWS using OIDC
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Debug OIDC token claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`Issuer: ${payload.iss}`);
            core.info(`Audience: ${payload.aud}`);
            core.info(`Subject: ${payload.sub}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity


